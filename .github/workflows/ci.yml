name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: DoughTrackerUI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: DoughTrackerUI/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:plaid

  auth:
    name: Local authentication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Verify auth against a temporary database
        env:
          CONTAINER_NAME: doughtracker-ci-postgres
          VOLUME_NAME: doughtracker-ci-data
          DB_HOST: 127.0.0.1
          DB_PORT: '55432'
          DB_USER: doughtracker
          DB_NAME: doughtracker
          PLAID_ID: ''
          PLAID_SANDBOX_SECRET: ''
        run: |
          export DB_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          python -m uvicorn DoughTracker.main:app --host 127.0.0.1 --port 5083 > "$RUNNER_TEMP/doughtracker-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          curl --fail --silent --show-error --retry 60 --retry-connrefused --retry-delay 1 --max-time 5 http://127.0.0.1:5083/health
          npm --prefix DoughTrackerUI run test:auth
      - name: Print API log on failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/doughtracker-api.log" ]]; then
            cat "$RUNNER_TEMP/doughtracker-api.log"
          fi
