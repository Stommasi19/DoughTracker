services:
  api:
    build:
      context: .
      dockerfile: DoughTracker/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-5084}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "${MIGRATE_DATABASE:-false}"
      DevelopmentSeed__Enabled: "${SEED_DEVELOPMENT:-false}"
      DevelopmentSeed__Owners__0: "${SEED_OWNER_A:-alice}"
      DevelopmentSeed__Owners__1: "${SEED_OWNER_B:-bob}"
      ConnectionStrings__DoughTracker: "Host=postgres;Database=doughtracker;Username=doughtracker;Password=${POSTGRES_PASSWORD:-local-development-only}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: doughtracker
      POSTGRES_USER: doughtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doughtracker -d doughtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
