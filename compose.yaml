services:
  api:
    build:
      context: .
      dockerfile: DoughTracker/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-5084}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "${MIGRATE_DATABASE:-false}"
      DevelopmentSeed__Enabled: "${SEED_DEVELOPMENT:-false}"
      DevelopmentSeed__Owners__0: "${SEED_OWNER_A:-alice}"
      DevelopmentSeed__Owners__1: "${SEED_OWNER_B:-bob}"
      Messaging__Enabled: "true"
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: doughtracker
      RabbitMq__Password: "${RABBITMQ_PASSWORD:-local-development-only}"
      Plaid__Enabled: "${PLAID_ENABLED:-false}"
      Plaid__ClientId: "${PLAID_CLIENT_ID:-}"
      Plaid__Secret: "${PLAID_SECRET:-}"
      Plaid__WebhookUrl: "${PLAID_WEBHOOK_URL:-}"
      Plaid__RedirectUri: "${PLAID_REDIRECT_URI:-}"
      Secrets__Directory: /app/secrets
      ConnectionStrings__DoughTracker: "Host=postgres;Database=doughtracker;Username=doughtracker;Password=${POSTGRES_PASSWORD:-local-development-only}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - plaid-secrets:/app/secrets

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: doughtracker
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-local-development-only}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: doughtracker
      POSTGRES_USER: doughtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doughtracker -d doughtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
  plaid-secrets:
